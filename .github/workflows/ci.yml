name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # gcc-multilib provides the 32-bit headers c3_bof32 needs.
          sudo apt-get install -y gdb gcc-multilib libc6-dev-i386

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "textual>=8.2,<9" "pwntools>=4.15,<5" "rich>=15,<16"

      - name: Byte-compile
        run: python -m py_compile app.py

      - name: Build the challenge binaries
        working-directory: qa/audit
        run: ./build.sh

      - name: Run the QA battery
        working-directory: qa/audit
        run: |
          # ptrace_scope must allow GDB to attach to its own children.
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          ./run_all.sh | tee battery.log
          # run_all.sh always exits 0; the failures are in its output.
          if grep -qE '^(  !!|RESULT: [0-9])' battery.log; then
            echo "::error::QA battery reported failures"
            exit 1
          fi

      - name: Upload the error log if anything was swallowed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwntui-error-log
          path: ~/.cache/pwntui-error.log
          if-no-files-found: ignore
